<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NZA - Net Zero Advisory</title>
    <!--
      STATIC SPLASH - rendered the moment the HTML is parsed, BEFORE
      the JS bundle has loaded or React has mounted anything. Without
      this the user sees a blank screen for the duration of the JS
      fetch/parse - on mobile networks via Vercel that was ~15s for
      Chris. With this they immediately see the cream NZA splash and
      the static React preloader takes over the moment main.tsx
      finishes loading.

      The splash is removed by main.tsx the moment React mounts (just
      before the first render) so there's a clean handoff to the
      React-driven preloader animation.
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #FAF7F0; }
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #FAF7F0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #initial-splash svg {
        width: 84px;
        height: 84px;
      }
      #initial-splash .splash-label {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(14, 17, 32, 0.42);
        font-weight: 500;
      }
      #initial-splash .splash-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #0E1120;
        margin: 0 3px;
        opacity: 0.32;
        animation: splash-bob 1.4s ease-in-out infinite;
      }
      #initial-splash .splash-dot:nth-child(2) { animation-delay: 0.18s; }
      #initial-splash .splash-dot:nth-child(3) { animation-delay: 0.36s; }
      @keyframes splash-bob {
        0%, 100% { transform: translateY(0); opacity: 0.32; }
        50%      { transform: translateY(-4px); opacity: 0.72; }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-splash .splash-dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="initial-splash" aria-hidden="true">
      <!-- Real NZA mark - three nested triangles inside a circle.
           Verbatim from public/assets/logos/nza-mark-clean.svg so the
           static splash matches the brand mark Chris uses across the
           site rather than the simplified one-triangle stand-in that
           used to live here. -->
      <svg viewBox="0 0 300 298" xmlns="http://www.w3.org/2000/svg">
        <g fill="#0E1120">
          <path d="M169.48,166.16c-7.13-8.75-13.45-16.73-19.21-24.26-.2-.26-.58-.26-.78,0l-19.61,24.09c-.09.12-.24.18-.39.18h-9.27c-.42,0-.65-.49-.39-.82l29.88-36.38c.21-.25.59-.24.79.02l2.68,3.56c6.43,8.56,17.5,22.43,25.94,32.81.27.33.03.81-.39.81h-9.26.01Z"/>
          <path d="M250.35,213.07H50.7c-.42,0-.65-.48-.39-.81l99.3-124.12c.2-.25.58-.25.78,0l99.96,124.93h0ZM66.24,205.1h166.47c.42,0,.65-.48.39-.81l-82.72-103.39c-.2-.25-.58-.25-.78,0l-83.36,104.2h0Z"/>
          <path d="M250.35,167.05H50.7c-.42,0-.65-.48-.39-.81l99.3-124.12c.2-.25.58-.25.78,0l99.96,124.93h0ZM66.24,159.08h166.47c.42,0,.65-.48.39-.81l-82.72-103.39c-.2-.25-.58-.25-.78,0l-83.36,104.2h0Z"/>
          <path d="M149.99,279.63c-73.06,0-132.49-59.44-132.49-132.5S76.93,14.63,149.99,14.63s132.5,59.44,132.5,132.5-59.44,132.5-132.5,132.5h0ZM149.99,22.61c-68.66,0-124.52,55.86-124.52,124.52s55.86,124.52,124.52,124.52,124.52-55.86,124.52-124.52S218.66,22.61,150,22.61h0Z"/>
        </g>
      </svg>
      <div>
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
        <span class="splash-dot"></span>
      </div>
      <span class="splash-label">Net Zero Advisory</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
